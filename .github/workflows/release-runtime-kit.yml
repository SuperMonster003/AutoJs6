name: Release Runtime Kit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: AutoJs6 release tag, for example v6.7.1
        required: true
        type: string
      compatibility_min_host_version_code:
        description: Optional minimum compatible host versionCode; blank keeps exact matching
        required: false
        type: string
      compatibility_max_host_version_code:
        description: Optional maximum compatible host versionCode; blank keeps exact matching
        required: false
        type: string
      allow_patch_version_mismatch:
        description: Explicitly allow non-exact hosts inside the declared closed interval
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build-runtime-kit:
    runs-on: ubuntu-latest
    env:
      # AutoJs6 Releases carry only the host APKs, because users kept downloading the kits by mistake.
      # Not an AutoJs6-Plugin-* repository: the official plugin index treats every Release there as a plugin version.
      RUNTIME_KIT_REPO: SuperMonster003/AutoJs6-Runtime-Kits

    steps:
      - name: Checkout AutoJs6
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Runtime Kit
        env:
          COMPATIBILITY_MIN_HOST_VERSION_CODE: ${{ inputs.compatibility_min_host_version_code }}
          COMPATIBILITY_MAX_HOST_VERSION_CODE: ${{ inputs.compatibility_max_host_version_code }}
          ALLOW_PATCH_VERSION_MISMATCH: ${{ inputs.allow_patch_version_mismatch }}
        run: |
          args=(":app:generateRuntimeKit" "-x" ":app:lintVitalAnalyzeInrtRelease")
          if [ -n "$COMPATIBILITY_MIN_HOST_VERSION_CODE" ]; then
            args+=("--project-prop=autojs.runtimeKit.compatibility.minHostVersionCode=$COMPATIBILITY_MIN_HOST_VERSION_CODE")
          fi
          if [ -n "$COMPATIBILITY_MAX_HOST_VERSION_CODE" ]; then
            args+=("--project-prop=autojs.runtimeKit.compatibility.maxHostVersionCode=$COMPATIBILITY_MAX_HOST_VERSION_CODE")
          fi
          allow_patch_version_mismatch="${ALLOW_PATCH_VERSION_MISMATCH:-false}"
          args+=("--project-prop=autojs.runtimeKit.compatibility.allowPatchVersionMismatch=$allow_patch_version_mismatch")
          ./gradlew "${args[@]}"

      - name: Verify native ELF and APK ZIP alignment
        run: python3 tools/16kb/verify_apks.py app/build/runtime-kit --report build/reports/native-alignment/sdk-verification.json

      - name: Upload native alignment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-alignment-release-runtime-kit
          path: |
            app/build/reports/native-alignment/*.json
            build/reports/native-alignment/*.json

      - name: Upload Runtime Kit artifact
        uses: actions/upload-artifact@v4
        with:
          name: autojs6-runtime-kit
          path: app/build/runtime-kit/autojs6-runtime-kit-*.zip

      - name: Publish Runtime Kit to the Runtime Kit repository
        env:
          GH_TOKEN: ${{ secrets.AUTOJS6_RUNTIME_KIT_REPO_TOKEN || secrets.AUTOJS6_PLUGIN_REPO_TOKEN }}
          TARGET_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -z "$GH_TOKEN" ]; then
            if [ "$GITHUB_REPOSITORY" = "SuperMonster003/AutoJs6" ]; then
              echo "AUTOJS6_RUNTIME_KIT_REPO_TOKEN or AUTOJS6_PLUGIN_REPO_TOKEN must be configured." >&2
              exit 1
            fi
            echo "No Runtime Kit repository token is configured; skipping the Runtime Kit Release."
            exit 0
          fi
          tag="$TARGET_TAG"
          archives=(app/build/runtime-kit/autojs6-runtime-kit-*.zip)
          test "${#archives[@]}" -gt 0
          notes="Runtime Kit archives built from $GITHUB_REPOSITORY $tag ($GITHUB_SHA).

          These zip files are build inputs of SuperMonster003/AutoJs6-Plugin-APK-Builder-Template and cannot be installed on a device.
          To install AutoJs6, download an APK from https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          if gh release view "$tag" --repo "$RUNTIME_KIT_REPO" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$RUNTIME_KIT_REPO" --notes "$notes"
          else
            gh release create "$tag" --repo "$RUNTIME_KIT_REPO" --title "$tag Runtime Kit" --notes "$notes"
          fi
          gh release upload "$tag" "${archives[@]}" --repo "$RUNTIME_KIT_REPO" --clobber

          # A rerun after a version change would otherwise leave two kits of one variant, which the template rejects.
          uploaded_names="$(for file in "${archives[@]}"; do basename "$file"; done)"
          while IFS= read -r asset_name; do
            case "$asset_name" in
              autojs6-runtime-kit-*) ;;
              *) continue ;;
            esac
            if ! grep -Fxq -- "$asset_name" <<< "$uploaded_names"; then
              echo "Removing stale Runtime Kit asset $asset_name."
              gh release delete-asset "$tag" "$asset_name" --repo "$RUNTIME_KIT_REPO" --yes
            fi
          done < <(gh release view "$tag" --repo "$RUNTIME_KIT_REPO" --json assets --jq '.assets[].name')

      - name: Trigger APK Builder plugin repository
        env:
          GH_TOKEN: ${{ secrets.AUTOJS6_PLUGIN_REPO_TOKEN }}
          PLUGIN_REPO: SuperMonster003/AutoJs6-Plugin-APK-Builder-Template
          TARGET_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            if [ "$GITHUB_REPOSITORY" = "SuperMonster003/AutoJs6" ]; then
              echo "AUTOJS6_PLUGIN_REPO_TOKEN must be configured." >&2
              exit 1
            fi
            echo "AUTOJS6_PLUGIN_REPO_TOKEN is not configured; skipping repository_dispatch."
            exit 0
          fi
          tag="$TARGET_TAG"
          gh api \
            "repos/$PLUGIN_REPO/dispatches" \
            -f event_type=autojs6_runtime_kit_released \
            -f client_payload[tag]="$tag" \
            -f client_payload[source_repo]="$GITHUB_REPOSITORY" \
            -f client_payload[runtime_kit_repo]="$RUNTIME_KIT_REPO"
