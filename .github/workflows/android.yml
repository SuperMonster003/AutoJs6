name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRADLE_CI_TIMEOUT_SECONDS: '3600'
      GRADLE_CI_MAX_LOG_BYTES: '33554432'
      GRADLE_CI_LOG_FILE: ${{ runner.temp }}/android-gradle-build.log

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run ACE editor gate
        run: node tools/ace-ci/check-ace-editor-gate.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Install CMake 3.10.2
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/cmake-3.10.2-Linux-x86_64.sh"
          wget -q https://cmake.org/files/v3.10/cmake-3.10.2-Linux-x86_64.sh -O "$installer"
          chmod +x "$installer"
          sudo "$installer" --skip-license --prefix=/usr/local >/dev/null
          cmake --version

      - name: Verify preinstalled Ninja
        run: ninja --version

      - name: Build Runtime Kit, app and APK Builder plugin
        run: |
          set -euo pipefail
          chmod +x gradlew
          bash .github/scripts/run-gradle-ci.sh \
            ./gradlew assembleApkBuilderTemplateDistribution \
            -x :app:lintVitalAnalyzeInrtRelease \
            --no-daemon \
            --build-cache \
            --console=plain \
            --stacktrace

      - name: Upload Gradle failure log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: android-gradle-failure-log
          path: ${{ runner.temp }}/android-gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Runtime Kit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: autojs6-runtime-kit
          path: app/build/runtime-kit/autojs6-runtime-kit-*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-arm64-apk
          path: app/build/outputs/apk/app/release/*-arm64-v8a.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload armv7 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-armv7-apk
          path: app/build/outputs/apk/app/release/*-v7a.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload universal artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-universal-apk
          path: app/build/outputs/apk/app/release/*-universal.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload APK Builder template plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-builder-template-plugin-apk
          path: plugins/apk-builder-template/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
