name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRADLE_CI_TIMEOUT_SECONDS: '3600'
      GRADLE_CI_MAX_LOG_BYTES: '33554432'

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run editor plugin host gate
        run: node tools/ace-ci/check-ace-editor-gate.mjs

      - name: Set up JDK 21 and Gradle dependency cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Test plugin hosts and build distributions
        run: |
          set -euo pipefail
          chmod +x gradlew
          bash .github/scripts/run-gradle-ci.sh \
            ./gradlew \
            :app:testAppDebugUnitTest \
            --tests org.autojs.autojs.core.plugin.editor.AceEditorPluginPolicyTest \
            --tests org.autojs.autojs.ui.edit.editor.engine.AceEditorPluginMappingsTest \
            --tests org.autojs.autojs.ui.edit.editor.ace.lsp.AceLspServerManagerTest \
            --tests org.autojs.autojs.core.plugin.ai.* \
            --tests org.autojs.autojs.core.plugin.dex.* \
            --tests org.autojs.autojs.core.plugin.lua.* \
            --tests org.autojs.autojs.engine.Lua* \
            --tests org.autojs.autojs.external.shortcut.ScriptShortcutLaunchDescriptorTest \
            --tests org.autojs.autojs.script.Lua* \
            --tests org.autojs.autojs.ui.edit.editor.service.EditorScriptRunPolicyTest \
            --tests org.autojs.autojs.util.Lua* \
            --no-daemon \
            --build-cache \
            --console=plain \
            --stacktrace
          bash .github/scripts/run-gradle-ci.sh \
            ./gradlew \
            :plugin-api:protocol-wire-api:testDebugUnitTest \
            :plugin-api:ai-common-api:testDebugUnitTest \
            :plugin-api:ai-provider-api:testDebugUnitTest \
            :plugin-api:dex-compiler-api:testDebugUnitTest \
            :plugin-api:lua-runtime-api:testDebugUnitTest \
            :plugin-api:ui-preview-api:testDebugUnitTest \
            :plugin-api:lua-runtime-api:assembleDebug \
            :test-apps:ai-provider-conformance:testDebugUnitTest \
            :test-apps:dex-compiler-conformance:testDebugUnitTest \
            :test-apps:lua-runtime-conformance:testDebugUnitTest \
            :test-apps:mcp-server-conformance:testDebugUnitTest \
            :test-apps:ai-provider-conformance:assembleDebug \
            :test-apps:dex-compiler-conformance:assembleDebug \
            :test-apps:lua-runtime-conformance:assembleDebug \
            :test-apps:mcp-server-conformance:assembleDebug \
            --no-daemon \
            --build-cache \
            --console=plain \
            --stacktrace
          bash .github/scripts/run-gradle-ci.sh \
            ./gradlew \
            :app:compileAppDebugAndroidTestKotlin \
            assembleApkBuilderTemplateDistribution \
            -x :app:lintVitalAnalyzeInrtRelease \
            --no-daemon \
            --build-cache \
            --console=plain \
            --stacktrace

      - name: Verify native ELF and APK ZIP alignment
        run: python3 tools/16kb/verify_apks.py app/build/outputs/apk --report build/reports/native-alignment/sdk-verification.json

      - name: Upload native alignment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-alignment-android
          path: |
            app/build/reports/native-alignment/*.json
            build/reports/native-alignment/*.json

      - name: Upload Gradle failure log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-failure-log
          path: ${{ runner.temp }}/android-gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Runtime Kit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autojs6-runtime-kit
          path: app/build/runtime-kit/autojs6-runtime-kit-*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-arm64-apk
          path: app/build/outputs/apk/app/release/*-arm64-v8a.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload armv7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-armv7-apk
          path: app/build/outputs/apk/app/release/*-v7a.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-universal-apk
          path: app/build/outputs/apk/app/release/*-universal.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload APK Builder template plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-builder-template-plugin-apk
          path: plugins/apk-builder-template/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
