name: CI Repair Branch

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ci-repair-branch
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/dynamic-ksp-agp-and-ace-ci
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .utils/package-lock.json

      - name: Install scraper dependencies
        working-directory: .utils
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Apply source patches
        run: node .github/ci-repair/apply-ci-repair.mjs

      - name: Refresh KSP and AGP compatibility data
        working-directory: .utils
        run: node scrape-and-inject-ksp-agp-compatibility-map.mjs

      - name: Refresh ACE generated artifacts
        run: |
          node tools/ace-completion/generate-autojs6-indices-from-dts.mjs
          node tools/ace-completion/generate-autojs6-indices.mjs
          node tools/ace-completion/generate-dts.mjs

      - name: Run complete ACE editor gate
        run: node tools/ace-ci/check-ace-editor-gate.mjs

      - name: Validate generated Node.js scripts
        run: |
          node --check .utils/scrape-and-inject-ksp-agp-compatibility-map.mjs
          node --check .utils/run-scrapers.mjs
          node --check .github/ci-repair/apply-ci-repair.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Runtime Kit Gradle configuration
        run: |
          chmod +x gradlew
          ./gradlew :app:generateRuntimeKit -x :app:lintVitalAnalyzeInrtRelease --dry-run

      - name: Commit and push repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            settings.gradle.kts \
            .utils/run-scrapers.mjs \
            gradle/data/ksp-agp-compat.properties \
            app/src/main/assets \
            tools/ace-completion \
            tools/editor-refactor/check-editor-boundaries.mjs \
            tools/ace-hardening/check-editor-surface.mjs
          if git diff --cached --quiet; then
            echo "No generated repair changes to commit."
            exit 0
          fi
          git commit -m "fix: align KSP AGP selection and ACE generated data"
          git pull --rebase origin fix/dynamic-ksp-agp-and-ace-ci
          git push origin HEAD:fix/dynamic-ksp-agp-and-ace-ci
