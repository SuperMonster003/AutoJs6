name: CI Repair Branch

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-repair-branch
  cancel-in-progress: true

jobs:
  diagnose-ksp-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/dynamic-ksp-agp-and-ace-ci
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run KSP AGP compatibility scraper
        id: scraper
        continue-on-error: true
        working-directory: .utils
        run: |
          set -o pipefail
          node scrape-and-inject-ksp-agp-compatibility-map.mjs 2>&1 | tee ../ksp-scraper.log

      - name: Upload complete scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksp-scraper-log
          path: ksp-scraper.log
          if-no-files-found: error

      - name: Enforce scraper result
        if: steps.scraper.outcome != 'success'
        run: exit 1
