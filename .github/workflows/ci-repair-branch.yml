name: CI Repair Branch

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-repair-branch
  cancel-in-progress: true

jobs:
  diagnose-ace-boundaries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/dynamic-ksp-agp-and-ace-ci
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply source patches
        run: node .github/ci-repair/apply-ci-repair.mjs

      - name: Run ACE editor boundary checks
        id: boundaries
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/editor-refactor/check-editor-boundaries.mjs 2>&1 | tee ace-boundaries.log

      - name: Upload complete boundary log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-boundaries-log
          path: ace-boundaries.log
          if-no-files-found: error

      - name: Enforce boundary result
        if: steps.boundaries.outcome != 'success'
        run: exit 1
