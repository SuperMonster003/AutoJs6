name: CI Repair Branch

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-repair-branch
  cancel-in-progress: true

jobs:
  diagnose-ace-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/dynamic-ksp-agp-and-ace-ci
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .utils/package-lock.json

      - name: Install scraper dependencies
        working-directory: .utils
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Apply source patches
        run: node .github/ci-repair/apply-ci-repair.mjs

      - name: Refresh KSP and AGP compatibility data
        working-directory: .utils
        run: node scrape-and-inject-ksp-agp-compatibility-map.mjs

      - name: Refresh ACE generated artifacts
        run: |
          node tools/ace-completion/generate-autojs6-indices-from-dts.mjs
          node tools/ace-completion/generate-autojs6-indices.mjs
          node tools/ace-completion/generate-dts.mjs
          mkdir -p .ci-logs

      - name: ACE editor boundary checks
        id: boundaries
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/editor-refactor/check-editor-boundaries.mjs 2>&1 | tee .ci-logs/boundaries.log

      - name: ACE surface hardening checks
        id: surface
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/ace-hardening/check-editor-surface.mjs 2>&1 | tee .ci-logs/surface.log

      - name: AutoJs6 API model verification
        id: api-model
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/ace-completion/verify-autojs6-api-model.mjs 2>&1 | tee .ci-logs/api-model.log

      - name: AutoJs6 Pro-only API detection
        id: pro-only
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/ace-completion/verify-autojs6-pro-only.mjs 2>&1 | tee .ci-logs/pro-only.log

      - name: AutoJs6 completion index verification
        id: indices
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/ace-completion/verify-autojs6-indices.mjs 2>&1 | tee .ci-logs/indices.log

      - name: AutoJs6 generated d.ts verification
        id: dts
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/ace-completion/verify-autojs6-dts.mjs 2>&1 | tee .ci-logs/dts.log

      - name: ACE completer tests
        id: completer
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/ace-completion/test-completer.mjs 2>&1 | tee .ci-logs/completer.log

      - name: ACE LSP client tests
        id: lsp
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/ace-lsp/test-lsp-client.mjs 2>&1 | tee .ci-logs/lsp.log

      - name: ACE tooltip tests
        id: tooltip
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/ace-tooltip/test-tooltip.mjs 2>&1 | tee .ci-logs/tooltip.log

      - name: ACE signature help tests
        id: signature
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/ace-signature/test-signature-help.mjs 2>&1 | tee .ci-logs/signature.log

      - name: Upload complete ACE diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-gate-logs
          path: .ci-logs
          if-no-files-found: error

      - name: Enforce ACE diagnostics
        if: >-
          always() &&
          (steps.boundaries.outcome != 'success' ||
           steps.surface.outcome != 'success' ||
           steps.api-model.outcome != 'success' ||
           steps.pro-only.outcome != 'success' ||
           steps.indices.outcome != 'success' ||
           steps.dts.outcome != 'success' ||
           steps.completer.outcome != 'success' ||
           steps.lsp.outcome != 'success' ||
           steps.tooltip.outcome != 'success' ||
           steps.signature.outcome != 'success')
        run: exit 1
