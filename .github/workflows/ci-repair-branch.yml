name: CI Repair Branch

on:
  push:
    branches:
      - "fix/dynamic-ksp-agp-and-ace-ci"
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/dynamic-ksp-agp-and-ace-ci
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply source patches
        run: node .github/ci-repair/apply-ci-repair.mjs

      - name: Refresh KSP and AGP compatibility data
        id: ksp-compat
        continue-on-error: true
        working-directory: .utils
        run: |
          set -o pipefail
          node scrape-and-inject-ksp-agp-compatibility-map.mjs 2>&1 | tee ../.github/ci-repair/ksp-scraper.log

      - name: Refresh ACE generated artifacts
        run: |
          node tools/ace-completion/generate-autojs6-indices-from-dts.mjs
          node tools/ace-completion/generate-autojs6-indices.mjs
          node tools/ace-completion/generate-dts.mjs

      - name: Validate Node.js scripts
        run: |
          node --check .utils/scrape-and-inject-ksp-agp-compatibility-map.mjs
          node --check .utils/run-scrapers.mjs
          node --check .github/ci-repair/apply-ci-repair.mjs

      - name: Run ACE editor gate diagnostics
        run: node tools/ace-ci/check-ace-editor-gate.mjs

      - name: Commit generated repair and diagnostics
        run: |
          if git diff --quiet && git diff --cached --quiet && [ ! -f .github/ci-repair/ksp-scraper.log ]; then
            echo "No repair changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.gradle.kts .utils/run-scrapers.mjs gradle/data/ksp-agp-compat.properties app/src/main/assets tools/ace-completion .github/ci-repair/ksp-scraper.log
          git commit -m "fix: align generated build and ACE compatibility data"
          git push origin HEAD:fix/dynamic-ksp-agp-and-ace-ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle settings diagnostics
        run: |
          chmod +x gradlew
          ./gradlew help

      - name: Enforce KSP compatibility scraper success
        if: steps.ksp-compat.outcome != 'success'
        run: exit 1
