name: CI Repair Branch

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ci-repair-branch
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/dynamic-ksp-agp-and-ace-ci
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize validated source changes
        run: |
          node .github/ci-repair/apply-ci-repair.mjs
          node tools/ace-completion/generate-autojs6-indices-from-dts.mjs
          node tools/ace-completion/generate-autojs6-indices.mjs
          node tools/ace-completion/generate-dts.mjs
          node tools/ace-ci/check-ace-editor-gate.mjs

      - name: Create repair commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git -c commit.gpgsign=false commit --no-verify -m "fix: align KSP AGP selection and ACE generated data"

      - name: Push repair commit
        run: |
          git log -1 --oneline
          git push origin HEAD:fix/dynamic-ksp-agp-and-ace-ci
