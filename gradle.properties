## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# Thu Nov 11 16:38:18 CST 2021
# Configure memory settings for Gradle daemon and Kotlin daemon
# -Xms: Initial heap size
# -Xmx: Maximum heap size
# UseParallelGC: Use parallel garbage collector for better performance
org.gradle.jvmargs=-Xms4g -Xmx4g -Dkotlin.daemon.jvm.options\="-Xmx4g" -Dfile.encoding\=UTF-8 -XX:+UseParallelGC
# https://docs.gradle.org/current/userguide/gradle_daemon.html
org.gradle.daemon=true
# Temporarily stops AGP version checking
android.injected.studio.version.check=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
# https://developer.android.com/jetpack/androidx/migrate
android.useAndroidX=true
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# Version metadata writes are opt-in to avoid mutating version.properties during ordinary builds.
autojs.gradle.build.number.auto.increment.enabled=false
autojs.gradle.build.time.update.enabled=false
# Default to the embedded Node.js backend for IDE Run/Debug builds.
# nodePlugin builds load libnode.so and libautojs6-node.so from the enabled Node.js plugin by default.
# Override with -Pautojs.nodejs.backend=rhino when a Rhino-only build is needed.
autojs.nodejs.backend=embedded
# Embedded Node release packaging profile.
# Valid values: nodeFull, nodeMini, nodePlugin, rhinoOnly.
# nodeMini can be narrowed with -Pautojs.nodejs.releaseAbis=arm64-v8a.
# Ordinary inrt template tasks force rhinoOnly so assets-app/template.apk stays slim.
autojs.nodejs.releaseFlavor=nodePlugin
# Include built-in APK builder template in app APK.
# Set false for plugin-only template distribution.
autojs.apkBuilder.includeBuiltInTemplate=true
# Pass -Pautojs.nodejs.hostBridge.enabled=true to build libautojs6-node.so inside the host app.
# Pass -Pautojs.nodejs.runtimeJniLibs=<dir> when host bridge builds should link against external libnode.so files.
# Node Profile identity profile.
# Valid values: production, nodejsTest.
# production uses org.autojs.autojs6 / AutoJs6; nodejsTest appends .nodejs for side-by-side device gates.
autojs.nodejs.identity=production
# Embedded backend probe defaults to a pure Kotlin service round-trip.
autojs.nodejs.embedded.probe.level=0
autojs.nodejs.embedded.probe.timeout.ms=3000
autojs.nodejs.embedded.script.enabled=true
# ESM is partial and enabled by default in Node Profile v1.1.
autojs.nodejs.esm.experimental=true
# Dynamic import is local-only partial support in Node Profile v1.1.
autojs.nodejs.dynamicImport.local=true
# Legacy broad dynamic import experiment remains release-forbidden.
autojs.nodejs.dynamicImport.experimental=false
# Network is design-gated and disabled by default in AutoJs6 Safe Node Profile.
autojs.nodejs.network.experimental=false
# worker_threads is design-gated and disabled by default in AutoJs6 Safe Node Profile.
autojs.nodejs.worker_threads.experimental=false
# child_process is design-gated and disabled by default in AutoJs6 Safe Node Profile.
autojs.nodejs.child_process.experimental=false
# Java interop is allowlist-gated and disabled by default in AutoJs6 Safe Node Profile.
autojs.nodejs.javaInterop.experimental=false
# Phase 13 profile rollback switches. All profile promotion and relaxed
# capability aggregation stays disabled until the corresponding promotion gate
# closes.
autojs.nodejs.profile.pro.enabled=false
autojs.nodejs.profile.desktop.enabled=false
autojs.nodejs.profile.debugUnsafeLab.enabled=false
autojs.nodejs.relaxedCapabilities.enabled=false
# Include LeakCanary in debug builds. When false, installing Debug APKs will not install Leaks APK.
autojs.leakcanary.enabled=false
# Configure Java installation settings
# auto-detect: Automatically detect Java installations on the system
# auto-download: Automatically download required Java version if not found
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
